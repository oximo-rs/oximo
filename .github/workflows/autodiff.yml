name: Autodiff (nightly)

# Exercises the `enzyme` features of oximo-autodiff and oximo-pounce, which
# need a nightly toolchain with the Enzyme engine (`-Zautodiff=Enable`) and
# the fat-LTO `enzyme` profile.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Cargo test (oximo-autodiff, enzyme)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Newer Enzyme nightlies currently reject the generated `eval_tape_ad`
      # derivative ABI during LLVM canonicalization.
      # See: https://github.com/rust-lang/rust/issues/160470
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: enzyme
      - uses: Swatinem/rust-cache@v2
      - name: Test oximo-autodiff with Enzyme
        run: cargo test -p oximo-autodiff --features enzyme --profile enzyme
        env:
          RUSTFLAGS: "-Zautodiff=Enable"

  pounce:
    name: Cargo test (oximo-pounce, enzyme)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: enzyme
      - uses: Swatinem/rust-cache@v2
      - name: Test oximo-pounce with Enzyme
        run: cargo test -p oximo-pounce --features enzyme --profile enzyme
        env:
          RUSTFLAGS: "-Zautodiff=Enable"
      - name: Test umbrella POUNCE tests with Enzyme
        run: cargo test -p oximo --no-default-features --features pounce-enzyme --profile enzyme --test solve_pounce --test persistent_parameters
        env:
          RUSTFLAGS: "-Zautodiff=Enable"

  wasm:
    name: Cargo test (oximo-autodiff, wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: enzyme
          targets: wasm32-wasip1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - name: Test oximo-autodiff with Enzyme on WebAssembly
        run: cargo test -p oximo-autodiff --features enzyme --profile enzyme --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "node ${{ github.workspace }}/.github/run-wasi.mjs"
          RUSTFLAGS: "-Zautodiff=Enable"
