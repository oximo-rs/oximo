name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Cargo clippy (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [highs, clarabel, clarabel-faer]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude oximo-gurobi --exclude oximo-mosek --all-targets --features oximo/${{ matrix.backend }} -- -D warnings

  default-features:
    name: Cargo test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p oximo --all-targets

  test:
    name: Cargo test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [highs, clarabel, clarabel-faer]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude oximo-gurobi --exclude oximo-mosek --features oximo/${{ matrix.backend }}

  scip:
    name: Cargo test (SCIP bundled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable test -p oximo-scip --tests
      - run: cargo +stable run -p oximo --no-default-features --features scip --example scip_minlp

  sdp:
    name: Cargo test (Clarabel SDP OpenBLAS)
    runs-on: ubuntu-latest
    env:
      OPENBLAS_TARGET: CORE2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: sdp-openblas-core2-v1
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: cargo check -p oximo --no-default-features --features clarabel-sdp
      - run: cargo test -p oximo-clarabel --features sdp-openblas --lib
      - run: cargo test -p oximo --features clarabel-sdp-openblas --test solve_sdp
      - run: cargo clippy -p oximo-core -p oximo-solver -p oximo-clarabel -p oximo --all-targets --features oximo/clarabel-sdp-openblas -- -D warnings
